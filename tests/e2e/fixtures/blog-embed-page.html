<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entre Paréntesis blog embed fixture</title>
    <style>
      :root {
        --wp--preset--spacing--50: 6rem;
      }

      body {
        margin: 0;
      }

      .wp-block-columns {
        display: flex;
      }

      .wp-block-post-title {
        margin-bottom: 0;
        font-size: 4rem;
      }

      .wp-block-column {
        min-width: 0;
      }

      .is-layout-constrained > #bracket-city-app {
        max-width: 40rem;
        margin-right: auto !important;
        margin-left: auto !important;
      }

      .entry-content > #bracket-city-app {
        margin-block-start: 24px;
      }

      @media (max-width: 781px) {
        .wp-block-columns {
          flex-wrap: wrap;
          gap: 24px;
        }

        .wp-block-column {
          flex-basis: 100% !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="wp-block-columns">
      <div class="wp-block-column" style="flex-basis: 30%"></div>
      <div class="wp-block-column" style="flex-basis: 60%">
        <div class="wp-block-spacer" style="height: 20px"></div>
        <h2 class="wp-block-post-title has-text-align-center">Puzzles</h2>
      </div>
      <div class="wp-block-column" style="flex-basis: 10%"></div>
    </div>
    <div class="wp-block-columns" data-testid="blog-content-row" style="padding-top: var(--wp--preset--spacing--50)">
      <div class="wp-block-column" style="flex-basis: 30%"></div>
      <div class="wp-block-column entry-content is-layout-constrained" style="flex-basis: 60%">
        <script id="nexo-supabase-config" type="application/json">
          {"url":"https://abcdefghijklmnopqrst.supabase.co","publishableKey":"sb_publishable_test-key"}
        </script>
        <main id="bracket-city-app"></main>
      </div>
      <div class="wp-block-column" style="flex-basis: 10%"></div>
    </div>
    <script src="http://127.0.0.1:4175/loader.js"></script>
  </body>
</html>
