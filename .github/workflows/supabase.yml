name: Deploy Supabase

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/supabase.yml
      - supabase/config.toml
      - supabase/functions/**
      - supabase/migrations/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy database and functions
    runs-on: ubuntu-latest
    environment: supabase-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Link the production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Apply database migrations
        run: supabase db push
      - name: Enable the manager-only Auth hook
        run: |
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --url "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"hook_custom_access_token_enabled":true,"hook_custom_access_token_uri":"pg-functions://postgres/private/puzzle_manager_access_token_hook"}' \
            --output /dev/null
      - name: Deploy Edge Functions
        if: ${{ hashFiles('supabase/functions/**/index.ts') != '' }}
        run: supabase functions deploy
